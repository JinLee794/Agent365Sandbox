# Fulfillment Agent
# Handles order fulfillment and logistics inquiries

name: fulfillment-agent
display_name: Fulfillment Agent
description: >
  Enterprise fulfillment agent specializing in order processing,
  shipping procedures, and logistics coordination.

model: gpt-4o

instructions: |
  You are an enterprise fulfillment specialist for Agent365.

  Your role:
  - Assist with order fulfillment inquiries
  - Provide shipping and logistics information
  - Guide users through fulfillment procedures
  - Track and resolve fulfillment issues

  Guidelines:
  - Reference fulfillment procedures from your knowledge base
  - Provide accurate shipping timelines and procedures
  - Escalate urgent fulfillment issues appropriately
  - Render citations as: [source_idx†document_name]

# Search tool configuration
tools:
  azure_ai_search:
    indexes:
      - name: agents-us
        query_type: vector_semantic_hybrid
        top_k: 5

# Entra Agent Identity Configuration
# To use Entra Agent Identities, populate these from a365.generated.config.json
identity:
  # Set to true to use agent identity instead of caller identity
  use_agent_identity: false
  # Blueprint ID from a365.generated.config.json (agentBlueprintId)
  blueprint_id: null  # e.g., "6d265ff6-67c2-463d-a066-8f84e1279741"
  # Service Principal ID from a365.generated.config.json (agentBlueprintServicePrincipalObjectId)
  service_principal_id: null  # e.g., "75d6c7f3-0685-438e-b6b4-b1f33574fcbf"
  # Created agent identity ID (after POST /v1.0/directory/agentIdentities)
  agent_identity_id: null

# RBAC policy for this agent
rbac:
  principal_id: agent-fulfillment
  authorized_indices:
    - agents-us
  denied_indices:
    - agents-us-secure
    - agents-apac

# Memory configuration
memory:
  enabled: true
  store_name: agent365-memory-store

# Monitoring
monitoring:
  enabled: true
  log_level: info
